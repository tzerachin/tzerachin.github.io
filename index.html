<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スプレッドシートにデータ送信</title>
</head>
<body>
    <h1>データをスプレッドシートに送信</h1>
    <form id="dataForm">
        <label for="value1">値1:</label>
        <input type="text" id="value1" name="value1"><br><br>
        <label for="value2">値2:</label>
        <input type="text" id="value2" name="value2"><br><br>
        <button type="submit">送信</button>
    </form>

    <script>
        document.getElementById('dataForm').addEventListener('submit', function(event) {
            event.preventDefault(); // フォームのデフォルトの送信を防止

            const scriptUrl = 'ここにデプロイしたApps ScriptのURLを貼り付けます';
            const value1 = document.getElementById('value1').value;
            const value2 = document.getElementById('value2').value;

            // 送信するデータをJSON形式で準備
            const data = {
                value1: value1,
                value2: value2
            };

            // fetch APIでデータを送信
            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors', // CORSエラーを回避するために設定
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                alert('データがスプレッドシートに送信されました。');
                // フォームをリセット
                document.getElementById('dataForm').reset();
            })
            .catch(error => {
                console.error('エラー:', error);
                alert('データの送信中にエラーが発生しました。');
            });
        });
    </script>
</body>
</html>
